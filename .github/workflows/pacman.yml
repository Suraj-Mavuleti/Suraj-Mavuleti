name: Update Pac-Man Contribution Grid

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Live GitHub Contributions & Generate Pac-Man Graph
        run: |
          curl -sL https://zero.skillissue.gg/api/github-contributions -o /tmp/contributions.json
          python3 generate_pacman_svg.py

      - name: Commit and Push Updated SVGs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dist/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(cron): auto-update Pac-Man contribution graph with real activity & 1s regen"
            git pull --rebase origin master
            git push origin master
          fi
