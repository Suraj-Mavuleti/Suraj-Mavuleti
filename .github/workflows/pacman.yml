name: Update Pac-Man Contribution Grid

on:
  schedule:
    # Run periodically to refresh static fallback SVGs in dist/
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Live GitHub Contributions & Generate Pac-Man Graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sL https://zero.skillissue.gg/api/github-contributions -o /tmp/contributions.json || true
          python3 build_native_assets.py

      - name: Commit and Push Updated SVGs
        run: |
          git config --local user.email "surajmavuleti@gmail.com"
          git config --local user.name "Suraj Mavuleti"
          git add dist/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(cron): auto-update Pac-Man contribution graph with maze barriers & 2s regen"
            git pull --rebase origin master
            git push origin master
          fi
